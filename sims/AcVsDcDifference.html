<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AC vs DC ചലനം, ബൾബ് മിന്നൽ & വാൾ താരതമ്യം</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #2563eb;
      --ac: #ea580c;
      --danger: #dc2626;
      --slow: #7c3aed;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, button, input, label, span, div, h1, h2, p, svg, text {
      font-family: 'Google Sans', 'Noto Sans Malayalam', sans-serif !important;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: #fff;
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.84rem;
      opacity: 0.9;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      gap: 4px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
    }

    .mode-btn {
      padding: 7px 14px;
      border: none;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      background: transparent;
      color: #475569;
      transition: 0.2s;
    }

    .mode-btn.active-dc {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .mode-btn.active-ac {
      background: #ffffff;
      color: var(--ac);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .ctrl-btn.slow-on {
      background: #f5f3ff;
      border-color: var(--slow);
      color: var(--slow);
    }

    .ctrl-btn.broken {
      background: #fef2f2;
      border-color: var(--danger);
      color: var(--danger);
    }

    .stage {
      background: #0f172a;
      padding: 12px 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    svg {
      width: 100%;
      max-width: 700px;
      height: auto;
    }

    /* Wood Saw Comparison Section */
    .analogy-section {
      background: #1e293b;
      border-top: 2px solid #334155;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .analogy-header {
      color: #e2e8f0;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-tag {
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 999px;
      background: #334155;
      color: #fde047;
    }

    .tip-box {
      margin: 14px 18px 18px;
      padding: 12px 15px;
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #1e3a8a;
    }

    .tip-box.warn {
      background: #fef2f2;
      border-left-color: var(--danger);
      color: #991b1b;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ചാലകത്തിലൂടെ AC, DC കടന്നുപോകുന്ന വിധം</h1>
    <p>സ്ലോ-മോഷനിൽ ബൾബിന്റെ മിന്നലും, ഗ്രാഫും, മരം മുറിക്കുന്ന വാൾ താരതമ്യവും കാണാം</p>
  </header>

  <div class="toolbar">
    <div class="btn-group">
      <button class="mode-btn" id="btnDC" onclick="setMode('DC')">🔋 DC (ഒരേ ദിശ)</button>
      <button class="mode-btn active-ac" id="btnAC" onclick="setMode('AC')">⚡ AC (അങ്ങോട്ടും ഇങ്ങോട്ടും)</button>
    </div>

    <div class="action-btns">
      <button class="ctrl-btn slow-on" id="btnSlow" onclick="toggleSlow()">
        🐢 സ്ലോ-മോഷൻ: ON
      </button>
      <button class="ctrl-btn" id="btnWire" onclick="toggleWire()">
        ✂️ 2-ാം വയർ മുറിക്കുക
      </button>
    </div>
  </div>

  <!-- MAIN CIRCUIT & GRAPH STAGE -->
  <div class="stage">
    <svg viewBox="0 0 680 285">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="10" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Top Wire -->
      <path d="M 110 75 L 570 75" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" opacity="0.35" />
      <path d="M 110 75 L 570 75" fill="none" stroke="#f87171" stroke-width="3" />
      <text x="340" y="55" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle" id="lblWire1">വയർ 1 : ഫേസ് (Phase)</text>

      <!-- Bottom Wire -->
      <g id="wire2Intact">
        <path d="M 110 225 L 570 225" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" opacity="0.35" />
        <path d="M 110 225 L 570 225" fill="none" stroke="#60a5fa" stroke-width="3" />
      </g>
      <g id="wire2Broken" style="display: none;">
        <path d="M 110 225 L 295 225 M 385 225 L 570 225" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="6 4" />
        <text x="340" y="230" fill="#ef4444" font-size="13" font-weight="800" text-anchor="middle">❌ മുറിഞ്ഞു</text>
      </g>
      <text x="340" y="252" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle" id="lblWire2">വയർ 2 : ന്യൂട്രൽ (Neutral)</text>

      <!-- Side vertical wires -->
      <path d="M 110 75 L 110 225" fill="none" stroke="#94a3b8" stroke-width="3" />
      <path d="M 570 75 L 570 225" fill="none" stroke="#94a3b8" stroke-width="3" />

      <!-- Electrons Group -->
      <g id="electronsGroup"></g>

      <!-- Power Source (Left) -->
      <g transform="translate(65, 115)">
        <rect x="0" y="0" width="90" height="70" rx="12" fill="#1e293b" stroke="#fb923c" stroke-width="2.5" id="srcBox" />
        <text x="45" y="30" fill="#fb923c" font-size="14" font-weight="800" text-anchor="middle" id="srcTitle">AC സപ്ലൈ</text>
        <text x="45" y="52" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" id="srcSub">(~ 50 Hz)</text>
      </g>

      <!-- Bulb (Right) -->
      <g transform="translate(570, 150)">
        <circle id="bulbAura" cx="0" cy="0" r="46" fill="#fde047" opacity="0.7" filter="url(#glow)" />
        <circle id="bulbBody" cx="0" cy="0" r="25" fill="#fef08a" stroke="#f59e0b" stroke-width="2.5" />
        <text x="0" y="5" fill="#0f172a" font-size="11.5" font-weight="800" text-anchor="middle" id="bulbTxt">ON</text>
      </g>
      <text x="570" y="196" fill="#fde047" font-size="11" font-weight="700" text-anchor="middle" id="bulbStateLbl">കത്തുന്നു</text>

      <!-- LIVE GRAPH IN CENTER -->
      <g transform="translate(215, 96)">
        <rect x="0" y="0" width="250" height="108" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <!-- Zero Line -->
        <line x1="25" y1="52" x2="235" y2="52" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
        <text x="14" y="25" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+ve</text>
        <text x="14" y="56" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">0</text>
        <text x="14" y="85" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">-ve</text>

        <!-- Static Wave Path -->
        <path id="graphPath" fill="none" stroke="#fb923c" stroke-width="2.5" />

        <!-- Moving Tracker Dot on Graph -->
        <circle id="graphDotGlow" cx="25" cy="52" r="9" fill="#fde047" opacity="0.4" />
        <circle id="graphDot" cx="25" cy="52" r="4.5" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />

        <text x="125" y="100" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle" id="graphLbl">AC ഗ്രാഫ് (0 എത്തുമ്പോൾ ബൾബ് OFF ആകും)</text>
      </g>
    </svg>
  </div>

  <!-- WOOD CUTTING SAW ANALOGY -->
  <div class="analogy-section">
    <div class="analogy-header">
      <span>🪵 മരം മുറിക്കുന്ന വാൾ താരതമ്യം (Saw Analogy):</span>
      <span class="badge-tag" id="sawBadge">സാധാരണ ഈർച്ചവാൾ (അങ്ങോട്ടും ഇങ്ങോട്ടും)</span>
    </div>

    <svg viewBox="0 0 640 120" style="max-width: 620px;">
      <!-- Wooden Log -->
      <rect x="190" y="62" width="260" height="44" rx="8" fill="#92400e" stroke="#78350f" stroke-width="2.5" />
      <ellipse cx="450" cy="84" rx="10" ry="22" fill="#d97706" stroke="#78350f" stroke-width="2" />
      <!-- Cut notch in wood -->
      <rect x="316" y="60" width="8" height="24" fill="#0f172a" />

      <!-- Sawdust particles -->
      <g id="sawdustGroup" fill="#fcd34d">
        <circle id="dust1" cx="320" cy="95" r="2.5" />
        <circle id="dust2" cx="312" cy="102" r="2" />
        <circle id="dust3" cx="328" cy="100" r="2.2" />
      </g>

      <!-- DC: Circular Chainsaw Blade (One Direction) -->
      <g id="dcSawGroup" transform="translate(320, 56)" style="display: none;">
        <g id="dcBladeSpin">
          <circle cx="0" cy="0" r="30" fill="#cbd5e1" stroke="#475569" stroke-width="3" stroke-dasharray="6 4" />
          <line x1="-26" y1="0" x2="26" y2="0" stroke="#334155" stroke-width="3" />
          <line x1="0" y1="-26" x2="0" y2="26" stroke="#334155" stroke-width="3" />
          <circle cx="0" cy="0" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
        </g>
        <text x="0" y="-36" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">↻ ഒരേ ദിശയിൽ കറങ്ങുന്നു (DC)</text>
      </g>

      <!-- AC: Hand Saw (Back and Forth) -->
      <g id="acSawGroup" transform="translate(320, 52)">
        <g id="acSawSlide">
          <!-- Handle -->
          <rect x="-115" y="-12" width="32" height="22" rx="5" fill="#ea580c" stroke="#9a3412" stroke-width="2" />
          <!-- Blade -->
          <path d="M -83 -8 L 85 -4 L 85 8 L 75 14 L 65 8 L 55 14 L 45 8 L 35 14 L 25 8 L 15 14 L 5 8 L -5 14 L -15 8 L -25 14 L -35 8 L -45 14 L -55 8 L -65 14 L -75 8 L -83 12 Z"
                fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
        </g>
        <text x="0" y="-26" fill="#fb923c" font-size="11" font-weight="700" text-anchor="middle">⇄ മുന്നോട്ടും പിന്നോട്ടും നീങ്ങുന്നു (AC)</text>
      </g>
    </svg>
  </div>

  <div class="tip-box" id="tipBox"></div>
</div>

<script>
  let mode = 'AC'; // Start with AC so user immediately sees flickering & wave dot
  let slowMo = true;
  let wireConnected = true;
  let phase = 0; // 0 to 2*PI for one full cycle

  const eGroup = document.getElementById('electronsGroup');
  const electrons = [];

  for (let i = 0; i < 10; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', '5.5');
    c.setAttribute('fill', '#fde047');
    c.setAttribute('stroke', '#0f172a');
    c.setAttribute('stroke-width', '1');
    eGroup.appendChild(c);
    electrons.push({ el: c, wire: 'top', basePos: i / 10 });
  }
  for (let i = 0; i < 10; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', '5.5');
    c.setAttribute('fill', '#fde047');
    c.setAttribute('stroke', '#0f172a');
    c.setAttribute('stroke-width', '1');
    eGroup.appendChild(c);
    electrons.push({ el: c, wire: 'bot', basePos: i / 10 });
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btnDC').className = `mode-btn ${mode === 'DC' ? 'active-dc' : ''}`;
    document.getElementById('btnAC').className = `mode-btn ${mode === 'AC' ? 'active-ac' : ''}`;
    updateUI();
  }

  function toggleSlow() {
    slowMo = !slowMo;
    const btn = document.getElementById('btnSlow');
    if (slowMo) {
      btn.className = 'ctrl-btn slow-on';
      btn.textContent = '🐢 സ്ലോ-മോഷൻ: ON';
    } else {
      btn.className = 'ctrl-btn';
      btn.textContent = '⚡ സാധാരണ വേഗത (50 Hz)';
    }
    updateUI();
  }

  function toggleWire() {
    wireConnected = !wireConnected;
    const btn = document.getElementById('btnWire');
    if (wireConnected) {
      btn.className = 'ctrl-btn';
      btn.textContent = '✂️ 2-ാം വയർ മുറിക്കുക';
    } else {
      btn.className = 'ctrl-btn broken';
      btn.textContent = '🔗 2-ാം വയർ യോജിപ്പിക്കുക';
    }
    updateUI();
  }

  function updateUI() {
    const isDC = mode === 'DC';
    document.getElementById('lblWire1').textContent = isDC ? 'വയർ 1 : പോസിറ്റീവ് (+)' : 'വയർ 1 : ഫേസ് (Phase)';
    document.getElementById('lblWire2').textContent = isDC ? 'വയർ 2 : നെഗറ്റീവ് (-)' : 'വയർ 2 : ന്യൂട്രൽ (Neutral)';
    document.getElementById('srcTitle').textContent = isDC ? 'DC ബാറ്ററി' : 'AC സപ്ലൈ';
    document.getElementById('srcSub').textContent = isDC ? '(+  /  -)' : '(~ 50 Hz)';
    document.getElementById('srcBox').setAttribute('stroke', isDC ? '#60a5fa' : '#fb923c');
    document.getElementById('srcTitle').setAttribute('fill', isDC ? '#60a5fa' : '#fb923c');

    document.getElementById('wire2Intact').style.display = wireConnected ? 'block' : 'none';
    document.getElementById('wire2Broken').style.display = wireConnected ? 'none' : 'block';

    document.getElementById('dcSawGroup').style.display = isDC ? 'block' : 'none';
    document.getElementById('acSawGroup').style.display = isDC ? 'none' : 'block';
    document.getElementById('sawBadge').textContent = isDC
      ? 'ചെയിൻസോ / സർക്കുലർ വാൾ (ഒരേ ദിശയിൽ)'
      : 'സാധാരണ ഈർച്ചവാൾ (മുന്നോട്ടും പിന്നോട്ടും)';

    const graphPath = document.getElementById('graphPath');
    const tipBox = document.getElementById('tipBox');

    if (!wireConnected) {
      graphPath.setAttribute('d', 'M 25 52 L 235 52');
      graphPath.setAttribute('stroke', '#64748b');
      document.getElementById('graphLbl').textContent = 'സെർക്കീട്ട് തുറന്നു (കറന്റ് = 0)';
      tipBox.className = 'tip-box warn';
      tipBox.innerHTML = `
        <strong>❌ 1 വയർ മാത്രം പോരാ!</strong><br>
        രണ്ടാമത്തെ വയർ മുറിച്ചപ്പോൾ സെർക്കീട്ട് തുറന്നു. വൈദ്യുതിക്ക് തിരികെ വരാൻ പാതയില്ലാത്തതിനാൽ ഇലക്ട്രോണുകളും വാളും നിശ്ചലമാകുകയും ബൾബ് അണയുകയും ചെയ്യുന്നു.
      `;
    } else {
      tipBox.className = 'tip-box';
      if (isDC) {
        graphPath.setAttribute('d', 'M 25 22 L 235 22');
        graphPath.setAttribute('stroke', '#38bdf8');
        document.getElementById('graphLbl').textContent = 'DC ഗ്രാഫ്: ഒരിക്കലും 0 ആകില്ല (ബൾബ് മിന്നില്ല)';
        tipBox.innerHTML = `
          <strong>🔋 DC (Direct Current) — ചെയിൻസോ പോലെ:</strong><br>
          സ്ലോ-മോഷനിലും നോക്കൂ—ഗ്രാഫിലെ ബിന്ദു ഒരിക്കലും <strong>0 (പൂജ്യം)</strong> തൊടുന്നില്ല! അതിനാൽ ബൾബ് <strong>മിന്നാതെ ഒരേപോലെ</strong> കത്തിക്കൊണ്ടിരിക്കുന്നു. ചെയിൻസോ ഒരേ ദിശയിൽ കറങ്ങി മരം മുറിക്കുന്നതുപോലെയാണ് DC-യിലെ ഇലക്ട്രോൺ പ്രവാഹം.
        `;
      } else {
        // Sine wave from x=25 to x=235 (span 210), 1 full cycle
        let d = 'M 25 52';
        for (let px = 0; px <= 210; px += 5) {
          const rad = (px / 210) * Math.PI * 2;
          const py = 52 - Math.sin(rad) * 30;
          d += ` L ${25 + px} ${py.toFixed(1)}`;
        }
        graphPath.setAttribute('d', d);
        graphPath.setAttribute('stroke', '#fb923c');
        document.getElementById('graphLbl').textContent = slowMo
          ? 'AC ഗ്രാഫ്: 0 എത്തുമ്പോൾ ബൾബ് OFF ആകുന്നത് ശ്രദ്ധിക്കൂ!'
          : 'AC (50 Hz): സെക്കന്റിൽ 100 തവണ മിന്നുന്നതിനാൽ കണ്ണിന് അറിയാനാകില്ല';
        tipBox.innerHTML = `
          <strong>⚡ AC (Alternating Current) — ഈർച്ചവാൾ പോലെ:</strong><br>
          നടുവിലെ ഗ്രാഫിലെ ബിന്ദു ശ്രദ്ധിക്കൂ! <strong>+ve</strong> ഉച്ചസ്ഥായിയിലും <strong>-ve</strong> ഉച്ചസ്ഥായിയിലും ബൾബ് നന്നായി പ്രകാശിക്കുകയും, <strong>0 (പൂജ്യം)</strong> എത്തുമ്പോൾ ബൾബ് <strong>OFF</strong> ആകുകയും ചെയ്യുന്നു! ഈർച്ചവാൾ അങ്ങോട്ടും ഇങ്ങോട്ടും നീങ്ങി മരം മുറിക്കുന്നതുപോലെയാണ് AC-യിലെ ഇലക്ട്രോൺ ചലനം.
        `;
      }
    }
  }

  let dcAngle = 0;

  function animate() {
    const speed = slowMo ? 0.028 : 0.28;
    if (wireConnected) {
      phase = (phase + speed) % (Math.PI * 2);
    }

    const startX = 160;
    const endX = 540;
    const span = endX - startX;

    // 1. Move Electrons
    electrons.forEach((e) => {
      let x;
      if (mode === 'DC') {
        const shift = wireConnected ? (phase / (Math.PI * 2)) : 0;
        if (e.wire === 'top') {
          x = startX + ((e.basePos + shift) % 1) * span;
        } else {
          x = startX + ((e.basePos - shift + 1) % 1) * span;
        }
      } else {
        const osc = wireConnected ? Math.sin(phase) * 20 : 0;
        x = startX + (e.basePos + 0.05) * (span - 20) + (e.wire === 'top' ? osc : -osc);
      }
      e.el.setAttribute('cx', x);
      e.el.setAttribute('cy', e.wire === 'top' ? 75 : 225);
    });

    // 2. Move Graph Dot & Update Bulb Brightness
    const dotX = 25 + (phase / (Math.PI * 2)) * 210;
    const bulbAura = document.getElementById('bulbAura');
    const bulbBody = document.getElementById('bulbBody');
    const bulbTxt = document.getElementById('bulbTxt');
    const bulbStateLbl = document.getElementById('bulbStateLbl');

    if (!wireConnected) {
      document.getElementById('graphDot').setAttribute('cx', 25);
      document.getElementById('graphDot').setAttribute('cy', 52);
      document.getElementById('graphDotGlow').setAttribute('cx', 25);
      document.getElementById('graphDotGlow').setAttribute('cy', 52);
      bulbAura.setAttribute('opacity', '0');
      bulbBody.setAttribute('fill', '#475569');
      bulbTxt.textContent = 'OFF';
      bulbStateLbl.textContent = 'അണഞ്ഞു (0 V)';
    } else if (mode === 'DC') {
      document.getElementById('graphDot').setAttribute('cx', dotX);
      document.getElementById('graphDot').setAttribute('cy', 22);
      document.getElementById('graphDotGlow').setAttribute('cx', dotX);
      document.getElementById('graphDotGlow').setAttribute('cy', 22);

      // Steady ON in DC
      bulbAura.setAttribute('opacity', '0.85');
      bulbBody.setAttribute('fill', '#fef08a');
      bulbTxt.textContent = 'ON';
      bulbStateLbl.textContent = 'മിന്നാതെ കത്തുന്നു';
    } else {
      // AC Mode
      const sinVal = Math.sin(phase);
      const dotY = 52 - sinVal * 30;
      document.getElementById('graphDot').setAttribute('cx', dotX);
      document.getElementById('graphDot').setAttribute('cy', dotY);
      document.getElementById('graphDotGlow').setAttribute('cx', dotX);
      document.getElementById('graphDotGlow').setAttribute('cy', dotY);

      const intensity = Math.abs(sinVal); // 0 at zero crossing, 1 at +ve and -ve peaks

      if (slowMo) {
        bulbAura.setAttribute('opacity', (intensity * 0.95).toFixed(2));
        if (intensity < 0.22) {
          bulbBody.setAttribute('fill', '#475569');
          bulbTxt.textContent = 'OFF';
          bulbStateLbl.textContent = 'പൂജ്യം (OFF)';
        } else {
          bulbBody.setAttribute('fill', intensity > 0.65 ? '#fef08a' : '#ca8a04');
          bulbTxt.textContent = sinVal > 0 ? '+ ON' : '- ON';
          bulbStateLbl.textContent = sinVal > 0 ? '+ve ദിശ (കത്തുന്നു)' : '-ve ദിശ (കത്തുന്നു)';
        }
      } else {
        // Normal 50 Hz speed: looks steady to human eye
        bulbAura.setAttribute('opacity', '0.75');
        bulbBody.setAttribute('fill', '#fef08a');
        bulbTxt.textContent = 'ON';
        bulbStateLbl.textContent = 'തുടർച്ചയായി തോന്നുന്നു';
      }
    }

    // 3. Animate Saw Analogy & Sawdust
    const dustGroup = document.getElementById('sawdustGroup');
    if (!wireConnected) {
      dustGroup.setAttribute('opacity', '0');
    } else {
      dustGroup.setAttribute('opacity', '1');
      const dShift = (phase * 15) % 18;
      document.getElementById('dust1').setAttribute('cy', 88 + dShift);
      document.getElementById('dust2').setAttribute('cy', 92 + ((dShift + 6) % 18));
      document.getElementById('dust3').setAttribute('cy', 90 + ((dShift + 12) % 18));

      if (mode === 'DC') {
        dcAngle = (dcAngle + (slowMo ? 3 : 18)) % 360;
        document.getElementById('dcBladeSpin').setAttribute('transform', `rotate(${dcAngle})`);
      } else {
        const slideX = Math.sin(phase) * 32;
        document.getElementById('acSawSlide').setAttribute('transform', `translate(${slideX.toFixed(1)}, 0)`);
      }
    }

    requestAnimationFrame(animate);
  }

  updateUI();
  animate();
</script>
</body>
</html>
