<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Simulation</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: #f1f5f9;
}
.box {
  background: white;
  max-width: 500px;
  margin: auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px #ccc;
}
button {
  padding: 12px 20px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
  <h1>🧪 Test Simulation</h1>
  <p id="result">Button അമർത്തി നോക്കൂ.</p>
  <button onclick="test()">പരീക്ഷിക്കുക</button>
</div>

<script>
function test() {
  document.getElementById("result").innerText =
    "✅ Simulation ശരിയായി പ്രവർത്തിക്കുന്നു!";
}
</script>

</body>
</html>
