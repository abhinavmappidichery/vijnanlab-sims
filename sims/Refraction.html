<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Light Lab — Refraction · Prism · Raindrop</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#070f1c;color:#e6eefc;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Malayalam",sans-serif;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #hint{position:absolute;left:16px;top:16px;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(11,26,46,.82);border:1px solid rgba(125,211,252,.35);color:#bae6fd;font-size:15px;font-weight:700;pointer-events:none;transition:opacity .45s;backdrop-filter:blur(6px);max-width:calc(100% - 32px)}
  #hint .dot{width:10px;height:10px;border-radius:50%;background:#fde68a;box-shadow:0 0 12px #fde68a;animation:pulse 1.4s infinite;flex:0 0 auto}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.45}}
  #hint.gone{opacity:0}
  #dock{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#0e1e33,#0a1526);border-top:1px solid rgba(125,211,252,.20);box-shadow:0 -12px 30px rgba(0,0,0,.5)}
  .dock-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .modes{display:flex;gap:8px;flex-wrap:wrap}
  .modes button{font:inherit;font-weight:800;font-size:15px;padding:11px 18px;border-radius:12px;border:1px solid rgba(125,211,252,.25);background:rgba(56,189,248,.08);color:#dbeafe;cursor:pointer;transition:all .15s;white-space:nowrap}
  .modes button:hover{background:rgba(56,189,248,.18)}
  .modes button.active{background:linear-gradient(180deg,#2563eb,#1d4ed8);border-color:#60a5fa;color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.45)}
  .modes button .k{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:rgba(255,255,255,.16);font-size:12px;font-weight:900;margin-right:8px}
  .swap-btn{font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.12);color:#fde68a;cursor:pointer;white-space:nowrap}
  .swap-btn:hover{background:rgba(251,191,36,.22)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .chip{display:inline-flex;align-items:baseline;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(125,211,252,.18);font-size:15px;white-space:nowrap}
  .chip .lbl{color:#93c5fd;font-weight:700}
  .chip .val{color:#fff;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
  .chip.status{font-weight:800;letter-spacing:.03em;font-size:13px;padding:10px 16px}
  .chip.status.refraction{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.45);color:#86efac}
  .chip.status.critical{background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55);color:#fde68a}
  .chip.status.tir{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.55);color:#fda4af;animation:flash 1.1s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}
  #resetBtn{font:inherit;font-weight:800;font-size:15px;padding:11px 20px;border-radius:12px;border:1px solid rgba(148,197,255,.25);background:rgba(255,255,255,.05);color:#cbd5e1;cursor:pointer;white-space:nowrap}
  #resetBtn:hover{background:rgba(255,255,255,.1)}
  .tip{font-size:14px;color:#94a3b8;line-height:1.45}
  .tip b{color:#fde68a}
  @media(max-width:720px){.modes button{font-size:13px;padding:9px 12px}.modes button .k{display:none}.chip{font-size:13px;padding:8px 11px}.chip .val{font-size:15px}#resetBtn,.swap-btn{font-size:13px;padding:9px 14px}.tip{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"><span class="dot"></span><span id="hintText">Drag to move the light ray</span></div>
  </div>
  <footer id="dock">
    <div class="dock-row">
      <div class="modes">
        <button class="mode active" data-mode="refraction"><span class="k">1</span>Critical Angle</button>
        <button class="mode" data-mode="prism"><span class="k">2</span>Prism</button>
        <button class="mode" data-mode="raindrop"><span class="k">3</span>Raindrop — 2 Drops</button>
      </div>
      <button id="swapBtn" class="swap-btn">⇅ Air → Water</button>
      <div class="stats" id="stats"></div>
      <button id="resetBtn">↺ Reset</button>
    </div>
    <div class="dock-row"><div class="tip" id="tip"></div></div>
  </footer>
</div>
<script>
(function(){
'use strict';
const D2R = Math.PI / 180;
const R2D = 180 / Math.PI;
const N_AIR = 1.000;
const N_WATER = 1.333;
const THETA_C = Math.asin(N_AIR / N_WATER);
const SPECTRUM = [
  { name:'Red',    color:'#ff4d4d', nGlass:1.510, nWater:1.331 },
  { name:'Orange', color:'#ff9f43', nGlass:1.513, nWater:1.333 },
  { name:'Yellow', color:'#ffdd59', nGlass:1.516, nWater:1.335 },
  { name:'Green',  color:'#4ade80', nGlass:1.518, nWater:1.337 },
  { name:'Blue',   color:'#3b82f6', nGlass:1.521, nWater:1.340 },
  { name:'Indigo', color:'#818cf8', nGlass:1.523, nWater:1.342 },
  { name:'Violet', color:'#a855f7', nGlass:1.526, nWater:1.344 },
];
const state = { mode:'refraction', theta:30*D2R, side:1, dir:'water-air', entryS:0.50, source:null, rainH:0.86 };
let W=1,H=1,DPR=1,UI=1,dragging=false,hasDragged=false,lastT=0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
const statsEl=document.getElementById('stats'), tipEl=document.getElementById('tip'), hintEl=document.getElementById('hint'), hintTxt=document.getElementById('hintText'), swapBtn=document.getElementById('swapBtn');

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function resize(){
  const r=stage.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,Math.round(r.width));
  H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  UI=clamp(H/700,0.90,1.30);
  if(state.mode==='prism') state.source=null;
}
new ResizeObserver(resize).observe(stage); resize();

function norm(x,y){ const m=Math.hypot(x,y)||1; return {x:x/m,y:y/m}; }
function dot(a,b){ return a.x*b.x+a.y*b.y; }
function refract(d,n,eta){ let N=n; if(dot(d,N)>0) N={x:-n.x,y:-n.y}; const cosI=-dot(d,N); const sin2=eta*eta*(1-cosI*cosI); if(sin2>1) return null; const cosT=Math.sqrt(1-sin2); const f=eta*cosI-cosT; return norm(eta*d.x+f*N.x, eta*d.y+f*N.y); }
function reflect(d,n){ const k=2*dot(d,n); return {x:d.x-k*n.x, y:d.y-k*n.y}; }
function raySegment(p,d,a,b){ const ex=b.x-a.x, ey=b.y-a.y; const det=ex*d.y-d.x*ey; if(Math.abs(det)<1e-9) return null; const qx=a.x-p.x, qy=a.y-p.y; const t=(qy*ex-qx*ey)/det; const s=(d.x*qy-d.y*qx)/det; if(t<1e-6||s<0||s>1) return null; return t; }
function circleNext(p,d,c,R){ const ux=p.x-c.x, uy=p.y-c.y; const b=ux*d.x+uy*d.y; const cc=ux*ux+uy*uy-R*R; const disc=b*b-cc; if(disc<0) return null; const t1=-b-Math.sqrt(disc), t2=-b+Math.sqrt(disc); if(t1>1e-4) return t1; if(t2>1e-4) return t2; return null; }
function outwardNormal(a,b,third){ const ex=b.x-a.x, ey=b.y-a.y; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; const vx=mx-third.x, vy=my-third.y; const nx1=ey, ny1=-ex; if(nx1*vx+ny1*vy>0) return norm(nx1,ny1); return norm(-ey,ex); }

/* ---------- responsive scene geometry ---------- */
function refrGeom(){
  return { ox:W*0.50, oy:H*0.52, L:Math.min(W*0.32,H*0.42) };
}
function prismGeom(){
  const sw=Math.min(W,H*1.6), sx=(W-sw)/2;
  const baseCx=sx+sw*0.40, baseY=H*0.74;
  const halfBase=Math.min(sw*0.18, H*0.30);
  const B={x:baseCx-halfBase,y:baseY}, C={x:baseCx+halfBase,y:baseY}, A={x:baseCx,y:baseY-halfBase*Math.sqrt(3)};
  return {A,B,C};
}
function rainGeom(){
  const sw=Math.min(W,H*1.15), sx=(W-sw)/2;
  const R=Math.min(sw*0.10, H*0.17);
  return {
    R,
    cx1:sx+sw*0.74, cy1:H*0.26,
    cx2:sx+sw*0.62, cy2:H*0.66,
    obs:{x:sx+sw*0.18, y:H*0.88},
    sw, sx
  };
}

/* ---------- drawing helpers ---------- */
function beam(x1,y1,x2,y2,color,alpha,width){ if(alpha<0.02) return; ctx.save(); ctx.lineCap='round'; ctx.globalAlpha=alpha; ctx.shadowColor=color; ctx.shadowBlur=16; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=alpha*0.9; ctx.strokeStyle='rgba(255,255,255,.88)'; ctx.lineWidth=Math.max(1,width*0.35); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
function lineNoGlow(x1,y1,x2,y2,color,alpha,width,dash){ ctx.save(); ctx.lineCap='round'; ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; if(dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
function dotAt(x,y,r,color,glow){ ctx.save(); if(glow){ctx.shadowColor=color; ctx.shadowBlur=glow;} ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function puck(x,y,t){ const p=1+0.08*Math.sin(t*4); ctx.save(); ctx.shadowColor='#fde68a'; ctx.shadowBlur=26; ctx.fillStyle='rgba(253,230,138,.97)'; ctx.beginPath(); ctx.arc(x,y,14*p,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(253,230,138,.40)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,22*p,0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function label(txt,x,y,size,color,align){ ctx.save(); ctx.fillStyle=color; ctx.font='800 '+(size*UI)+'px system-ui, sans-serif'; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(txt,x,y); ctx.restore(); }
function arrowHead(x,y,dx,dy,color,size){ const a=Math.atan2(dy,dx); ctx.save(); ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-size*Math.cos(a-0.45), y-size*Math.sin(a-0.45)); ctx.lineTo(x-size*Math.cos(a+0.45), y-size*Math.sin(a+0.45)); ctx.closePath(); ctx.fill(); ctx.restore(); }

/* ===== MODE 1 — REFRACTION / CRITICAL / TIR ===== */
function drawRefraction(t){
  const {ox,oy,L}=refrGeom();
  let g=ctx.createLinearGradient(0,0,0,oy); g.addColorStop(0,'#0a1930'); g.addColorStop(1,'#0d2340'); ctx.fillStyle=g; ctx.fillRect(0,0,W,oy);
  g=ctx.createLinearGradient(0,oy,0,H); g.addColorStop(0,'#0e2a4a'); g.addColorStop(1,'#071626'); ctx.fillStyle=g; ctx.fillRect(0,oy,W,H-oy);
  ctx.save(); ctx.strokeStyle='rgba(56,189,248,.28)'; ctx.lineWidth=1; for(let x=0;x<W;x+=14){ const yy=oy+Math.sin(x*0.05+t*2)*2; ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+8,yy); ctx.stroke(); } ctx.restore();
  ctx.save(); ctx.shadowColor='#38bdf8'; ctx.shadowBlur=18; ctx.strokeStyle='rgba(125,211,252,.95)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke(); ctx.restore();
  label('AIR   n = 1.00',20,oy-24,15,'rgba(186,230,253,.85)');
  label('WATER   n = 1.333',20,oy+30,15,'rgba(147,197,253,.95)');
  ctx.save(); ctx.setLineDash([7,9]); ctx.strokeStyle='rgba(148,197,255,.45)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(ox,oy-L*1.15); ctx.lineTo(ox,oy+L*1.25); ctx.stroke(); ctx.restore();
  label('normal',ox+10,oy-L*1.1,12,'rgba(148,163,184,.8)');
  const th=state.theta, s=state.side, isWaterAir=state.dir==='water-air';
  const dirSign=isWaterAir?-1:1;
  const n1=isWaterAir?N_WATER:N_AIR, n2=isWaterAir?N_AIR:N_WATER;
  const d={x:s*Math.sin(th), y:dirSign*Math.cos(th)};
  const src={x:ox-d.x*L, y:oy-d.y*L};
  const N={x:0,y:1};
  const refracted=refract(d,N,n1/n2);
  const reflected=reflect(d,N);
  let Rf=1;
  if(refracted){ const cosI=Math.abs(d.y), cosT=Math.abs(refracted.y); const rs=(n1*cosI-n2*cosT)/(n1*cosI+n2*cosT); const rp=(n2*cosI-n1*cosT)/(n2*cosI+n1*cosT); Rf=(rs*rs+rp*rp)/2; }
  const Tf=1-Rf;
  const distToCrit=isWaterAir?Math.abs(th-THETA_C):999;
  const nearCrit=isWaterAir && distToCrit<6*D2R;
  const reflAlpha=isWaterAir ? clamp(0.35+0.65*Math.pow(Rf,0.5),0.35,1) : clamp(0.15+0.5*Rf,0.15,0.65);
  beam(ox,oy, ox+reflected.x*L*1.08, oy+reflected.y*L*1.08, '#fbbf24', reflAlpha, 4);
  if(refracted){
    let alpha;
    if(nearCrit) alpha=0.92;
    else alpha=clamp(Tf*1.05,0.25,1);
    const len=nearCrit?L*1.45:L*1.18;
    beam(ox,oy, ox+refracted.x*len, oy+refracted.y*len, '#7dd3fc', alpha, 4.5);
    if(nearCrit) label('θ₂ → 90°  (grazing)', ox+s*L*0.55, oy-18, 16, '#7dd3fc', 'center');
  } else {
    if(isWaterAir && th>THETA_C && th<THETA_C+7*D2R){
      const fade=1-(th-THETA_C)/(7*D2R);
      ctx.save(); ctx.setLineDash([8,7]); ctx.strokeStyle='rgba(125,211,252,'+(0.55*fade).toFixed(2)+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+s*L*1.35, oy); ctx.stroke(); ctx.restore();
      label('grazing ray fades…', ox+s*L*0.62, oy-18, 13, 'rgba(125,211,252,'+(0.9*fade).toFixed(2)+')', 'center');
    }
  }
  beam(src.x,src.y,ox,oy,'#fde68a',1,5);
  const ar=L*0.30, nAng=Math.atan2(-dirSign,0), iAng=Math.atan2(-d.y,-d.x);
  let a1=nAng,a2=iAng; if(a1>a2){const tmp=a1;a1=a2;a2=tmp;}
  ctx.save(); ctx.strokeStyle='rgba(253,230,138,.95)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox,oy,ar,a1,a2); ctx.stroke();
  const am=(a1+a2)/2; label('θ₁ = '+(th*R2D).toFixed(1)+'°', ox+Math.cos(am)*(ar+34), oy+Math.sin(am)*(ar+34), 16, '#fde68a', 'center'); ctx.restore();
  if(refracted===null){ ctx.save(); ctx.strokeStyle='rgba(251,113,133,'+(0.45+0.35*Math.sin(t*6))+')'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(ox,oy,28+8*Math.sin(t*6),0,Math.PI*2); ctx.stroke(); ctx.restore(); }
  puck(src.x,src.y,t);
  const thDeg=th*R2D; let status,cls,tip;
  if(isWaterAir){
    if(refracted===null){ status='TOTAL INTERNAL REFLECTION'; cls='tir'; tip='Beyond θc the light cannot escape — it reflects entirely back into the water. The grazing ray fades out gradually, it does not vanish in one jump.'; }
    else if(Math.abs(th-THETA_C)<0.6*D2R){ status='CRITICAL ANGLE'; cls='critical'; tip='At exactly θc the refracted ray grazes the surface at 90°. Keep dragging a little — you will see it fade, not disappear suddenly.'; }
    else if(nearCrit){ status='NEAR CRITICAL'; cls='critical'; tip='Very close to θc — refracted ray is almost grazing, reflected ray is getting brighter.'; }
    else { status='REFRACTION'; cls='refraction'; tip='Light bends away from the normal as it leaves the denser water.'; }
  } else { status='REFRACTION (into water)'; cls='refraction'; tip='Light bends toward the normal as it enters the denser water.'; }
  const th2=refracted?Math.acos(Math.min(1,Math.abs(refracted.y)))*R2D:null;
  let chips=`<div class="chip"><span class="lbl">θ₁</span><span class="val">${thDeg.toFixed(1)}°</span></div>`;
  chips+=`<div class="chip"><span class="lbl">θ₂</span><span class="val">${th2===null?'— (no escape)':th2.toFixed(1)+'°'}</span></div>`;
  if(isWaterAir) chips+=`<div class="chip"><span class="lbl">θc</span><span class="val">${(THETA_C*R2D).toFixed(1)}°</span></div>`;
  chips+=`<div class="chip"><span class="lbl">Reflected</span><span class="val">${Math.round(Rf*100)}%</span></div>`;
  chips+=`<div class="chip status ${cls}">${status}</div>`;
  statsEl.innerHTML=chips; tipEl.innerHTML='<b>Tip:</b> '+tip+' Drag the yellow puck to change the angle.';
}

/* ===== MODE 2 — PRISM ===== */
function tracePrism(entry,d,nGlass){ const {A,B,C}=prismGeom(); const nAB=outwardNormal(A,B,C); const r1=refract(d,nAB,N_AIR/nGlass); if(!r1) return null; let best=null; const tAC=raySegment(entry,r1,A,C); if(tAC!==null) best={t:tAC,edge:'AC'}; const tBC=raySegment(entry,r1,B,C); if(tBC!==null&&(best===null||tBC<best.t)) best={t:tBC,edge:'BC'}; if(!best) return null; const exit={x:entry.x+r1.x*best.t, y:entry.y+r1.y*best.t}; const nExit=best.edge==='AC'?outwardNormal(A,C,B):outwardNormal(B,C,A); const r2=refract(r1,nExit,nGlass/N_AIR); if(!r2) return null; return {entry,r1,exit,r2}; }
function drawPrism(t){
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1930'); g.addColorStop(1,'#061020'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const {A,B,C}=prismGeom();
  ctx.save(); ctx.fillStyle='rgba(125,211,252,.07)'; ctx.strokeStyle='rgba(125,211,252,.8)'; ctx.lineWidth=2.5; ctx.shadowColor='#38bdf8'; ctx.shadowBlur=20; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  label('GLASS PRISM',(B.x+C.x)/2,B.y-18,15,'rgba(147,197,253,.95)','center'); label('60° apex',(B.x+C.x)/2,B.y-2,12,'rgba(148,163,184,.8)','center');
  const E={x:A.x+state.entryS*(B.x-A.x), y:A.y+state.entryS*(B.y-A.y)};
  if(!state.source){ const off=Math.min(300, Math.max(140, W*0.22)); state.source={x:Math.max(20, E.x-off), y:E.y}; }
  const src=state.source; const d=norm(E.x-src.x,E.y-src.y);
  beam(src.x,src.y,E.x,E.y,'#ffffff',1,6); label('White light',src.x+10,src.y-16,14,'rgba(255,255,255,.9)');
  const rays=[]; for(const c of SPECTRUM){ const tr=tracePrism(E,d,c.nGlass); if(tr) rays.push({c,tr}); }
  for(const {c,tr} of rays){ ctx.save(); ctx.strokeStyle=c.color; ctx.shadowColor=c.color; ctx.shadowBlur=10; ctx.lineWidth=2.2; ctx.globalAlpha=0.9; ctx.beginPath(); ctx.moveTo(tr.entry.x,tr.entry.y); ctx.lineTo(tr.exit.x,tr.exit.y); ctx.stroke(); ctx.restore(); const L=Math.hypot(W,H)*1.1; ctx.save(); ctx.strokeStyle=c.color; ctx.shadowColor=c.color; ctx.shadowBlur=12; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.globalAlpha=0.95; ctx.beginPath(); ctx.moveTo(tr.exit.x,tr.exit.y); ctx.lineTo(tr.exit.x+tr.r2.x*L, tr.exit.y+tr.r2.y*L); ctx.stroke(); ctx.restore(); }
  const red=rays.find(r=>r.c.name==='Red'), vio=rays.find(r=>r.c.name==='Violet');
  if(red&&vio){ const L=Math.hypot(W,H)*0.45; label('Red',red.tr.exit.x+red.tr.r2.x*L+12,red.tr.exit.y+red.tr.r2.y*L,16,'#ff6b6b'); label('Violet',vio.tr.exit.x+vio.tr.r2.x*L+12,vio.tr.exit.y+vio.tr.r2.y*L,16,'#c084fc'); }
  puck(src.x,src.y,t);
  let incAngle=null; if(red){ const nAB=outwardNormal(A,B,C); incAngle=Math.acos(Math.min(1,Math.abs(dot(d,nAB))))*R2D; }
  let spread='—'; if(red&&vio){ const aR=Math.atan2(red.tr.r2.y,red.tr.r2.x)*R2D, aV=Math.atan2(vio.tr.r2.y,vio.tr.r2.x)*R2D; spread=Math.abs(aV-aR).toFixed(1)+'°'; }
  statsEl.innerHTML=`<div class="chip"><span class="lbl">θᵢ</span><span class="val">${incAngle===null?'—':incAngle.toFixed(1)+'°'}</span></div><div class="chip"><span class="lbl">Spread</span><span class="val">${spread}</span></div><div class="chip status refraction">VIBGYOR — Red top</div>`;
  tipEl.innerHTML='<b>Tip:</b> Drag the white light source to change the angle. Red bends least (top), violet bends most (bottom) — that is VIBGYOR order.';
}

/* ===== MODE 3 — RAINDROP ===== */
function traceDrop(cx,cy,R,h,n){
  const ex=cx-Math.sqrt(Math.max(0,R*R-h*h)), ey=cy-h;
  const entry={x:ex,y:ey};
  const nOut=norm(ex-cx,ey-cy);
  const r1=refract({x:1,y:0},nOut,N_AIR/n); if(!r1) return null;
  const t2=circleNext(entry,r1,{x:cx,y:cy},R); if(!t2) return null;
  const back={x:ex+r1.x*t2, y:ey+r1.y*t2};
  const nBack=norm(back.x-cx,back.y-cy);
  const r2=reflect(r1,nBack);
  const t3=circleNext(back,r2,{x:cx,y:cy},R); if(!t3) return null;
  const exit={x:back.x+r2.x*t3, y:back.y+r2.y*t3};
  const nExit=norm(exit.x-cx,exit.y-cy);
  const r3=refract(r2,nExit,n/N_AIR); if(!r3) return null;
  const angle=Math.acos(Math.max(-1,Math.min(1,-r3.x)))*R2D;
  return {entry,back,exit,r1,r2,r3,angle};
}
function pointOnPolyline(pts, prog){
  let total=0; const lens=[];
  for(let i=0;i<pts.length-1;i++){ const l=Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y); lens.push(l); total+=l; }
  let target=prog*total;
  for(let i=0;i<lens.length;i++){
    if(target<=lens[i] || i===lens.length-1){
      const a=pts[i], b=pts[i+1]; const f=lens[i]===0?0:target/lens[i]; return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
    }
    target-=lens[i];
  }
  return pts[pts.length-1];
}
function drawRaindrop(t){
  const at=performance.now()/1000;
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1a33'); g.addColorStop(0.6,'#0a1428'); g.addColorStop(1,'#040a14'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const {cx1,cy1,cx2,cy2,R,obs}=rainGeom();
  const R1=R, R2=R;
  const h1=state.rainH*R1, h2=state.rainH*R2;
  const upTraces=[], lowTraces=[];
  for(const c of SPECTRUM){ const tr=traceDrop(cx1,cy1,R1,h1,c.nWater); if(tr) upTraces.push({c,tr}); }
  for(const c of SPECTRUM){ const tr=traceDrop(cx2,cy2,R2,h2,c.nWater); if(tr) lowTraces.push({c,tr}); }
  const upEntry=upTraces.length?upTraces[0].tr.entry:{x:cx1,y:cy1};
  const lowEntry=lowTraces.length?lowTraces[0].tr.entry:{x:cx2,y:cy2};
  beam(0,upEntry.y,upEntry.x,upEntry.y,'#fff7cc',1,5); arrowHead(upEntry.x-6,upEntry.y,1,0,'#fff7cc',10);
  beam(0,lowEntry.y,lowEntry.x,lowEntry.y,'#fff7cc',1,5); arrowHead(lowEntry.x-6,lowEntry.y,1,0,'#fff7cc',10);
  label('Sunlight  •  സൂര്യപ്രകാശം',18,Math.max(18,upEntry.y-18),14,'rgba(255,247,204,.95)');
  function drawDrop(cx,cy,R,lab){
    const dg=ctx.createRadialGradient(cx-R*0.35,cy-R*0.35,R*0.08,cx,cy,R); dg.addColorStop(0,'rgba(125,211,252,.22)'); dg.addColorStop(1,'rgba(56,189,248,.04)');
    ctx.fillStyle=dg; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.shadowColor='#38bdf8'; ctx.shadowBlur=22; ctx.strokeStyle='rgba(125,211,252,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke(); ctx.restore();
    label(lab,cx,cy+R+22,13,'rgba(147,197,253,.95)','center');
  }
  drawDrop(cx1,cy1,R1,'Upper drop  •  മുകളിലെ തുള്ളി');
  drawDrop(cx2,cy2,R2,'Lower drop  •  താഴത്തെ തുള്ളി');
  ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(cx1,cy1); ctx.lineTo(cx2,cy2); ctx.stroke(); ctx.restore();
  const midDx=(cx1+cx2)/2, midDy=(cy1+cy2)/2;
  label('drops thammil distance',midDx+10,midDy-10,12,'rgba(203,213,225,.85)');
  function meanAngle(traces){ let s=0; for(const o of traces) s+=o.tr.angle; return s/traces.length; }
  const meanUp=meanAngle(upTraces), meanLow=meanAngle(lowTraces);
  const EXAG=2.4;
  function exagDir(tr, mean){
    const ang=tr.angle;
    const ex=mean+(ang-mean)*EXAG;
    return {x:-Math.cos(ex*D2R), y:Math.sin(ex*D2R), ex};
  }
  function drawDropFan(traces, isUpper){
    const Lmiss=Math.min(W*0.52, H*0.92);
    for(let i=0;i<traces.length;i++){
      const {c,tr}=traces[i];
      lineNoGlow(tr.entry.x,tr.entry.y,tr.back.x,tr.back.y,c.color,0.95,2.3);
      lineNoGlow(tr.back.x,tr.back.y,tr.exit.x,tr.exit.y,c.color,0.95,2.3);
      dotAt(tr.entry.x,tr.entry.y,2.6,'#ffffff',8);
      dotAt(tr.back.x,tr.back.y,2.6,'#ffffff',8);
      dotAt(tr.exit.x,tr.exit.y,2.6,'#ffffff',8);
      const isReach = (isUpper && c.name==='Red') || (!isUpper && c.name==='Violet');
      let endPt, pts;
      if(isReach){
        beam(tr.exit.x,tr.exit.y,obs.x,obs.y,c.color,1,4.4);
        arrowHead(obs.x-4,obs.y, obs.x-tr.exit.x, obs.y-tr.exit.y, c.color, 11);
        endPt={x:obs.x,y:obs.y};
        pts=[{x:0,y:tr.entry.y}, tr.entry, tr.back, tr.exit, endPt];
      } else {
        const d=exagDir(tr, isUpper?meanUp:meanLow);
        endPt={x:tr.exit.x+d.x*Lmiss, y:tr.exit.y+d.y*Lmiss};
        if(endPt.y>H-8) endPt.y=H-8;
        if(endPt.y<8) endPt.y=8;
        if(endPt.x<8) endPt.x=8;
        lineNoGlow(tr.exit.x,tr.exit.y,endPt.x,endPt.y,c.color,0.78,2.4);
        arrowHead(endPt.x,endPt.y,d.x,d.y,c.color,8);
        pts=[{x:0,y:tr.entry.y}, tr.entry, tr.back, tr.exit, endPt];
      }
      const offset=(i*0.09 + (isUpper?0:0.45)) % 1;
      const prog=(at*0.32 + offset) % 1;
      const p=pointOnPolyline(pts, prog);
      dotAt(p.x,p.y,4.2,c.color,14);
      const p2=pointOnPolyline(pts, (prog-0.04+1)%1);
      dotAt(p2.x,p2.y,2.6,c.color,8);
    }
  }
  drawDropFan(upTraces, true);
  drawDropFan(lowTraces, false);
  label('VIBGYOR fan — Red top', cx1+ R1+8, cy1 - R1*0.6, 13, '#ff6b6b');
  label('Violet bottom', cx1+ R1+8, cy1 + R1*0.9, 13, '#c084fc');
  label('VIBGYOR fan — Violet to eye', cx2+ R2+8, cy2 - R2*0.6, 13, '#c084fc');
  const patchX=obs.x+38, patchY=obs.y-18, patchH=46, patchW=16;
  const bands=['#ff4d4d','#ff9f43','#ffdd59','#4ade80','#3b82f6','#818cf8','#a855f7'];
  ctx.save(); ctx.translate(patchX,patchY); ctx.rotate(0.6);
  for(let i=0;i<7;i++){ ctx.fillStyle=bands[i]; ctx.fillRect(-patchW/2, -patchH/2 + i*(patchH/7), patchW, patchH/7+1); }
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.2; ctx.strokeRect(-patchW/2,-patchH/2,patchW,patchH); ctx.restore();
  label('Red on top', patchX+24, patchY-30, 13, '#ff6b6b');
  label('Violet below', patchX+24, patchY+30, 13, '#c084fc');
  label('RED → eye (upper)', (upTraces.find(o=>o.c.name==='Red')?.tr.exit.x||cx1)+40, obs.y-52, 13, '#ff6b6b', 'center');
  label('VIOLET → eye (lower)', (lowTraces.find(o=>o.c.name==='Violet')?.tr.exit.x||cx2)+40, obs.y+52, 13, '#c084fc', 'center');
  ctx.save(); ctx.font='30px serif'; ctx.textAlign='center'; ctx.fillText('👁',obs.x,obs.y+6); ctx.restore();
  label('Observer  •  നിരീക്ഷകൻ', obs.x, obs.y+32, 13, 'rgba(203,213,225,.95)', 'center');
  if(upTraces.length) puck(18,upEntry.y,at);
  const upR=upTraces.find(o=>o.c.name==='Red'), lowV=lowTraces.find(o=>o.c.name==='Violet');
  const aR=upR?upR.tr.angle.toFixed(1):'—', aV=lowV?lowV.tr.angle.toFixed(1):'—';
  statsEl.innerHTML=`<div class="chip"><span class="lbl">Red (upper)</span><span class="val">${aR}° → eye</span></div><div class="chip"><span class="lbl">Violet (lower)</span><span class="val">${aV}° → eye</span></div><div class="chip"><span class="lbl">h/R</span><span class="val">${state.rainH.toFixed(2)}</span></div><div class="chip status refraction">FULL VIBGYOR • RED ON TOP</div>`;
  tipEl.innerHTML='<b>Tip:</b> Randu thulliyilum white light full VIBGYOR aayi split aakum. Upper drop-il ninn RED, lower drop-il ninn VIOLET aan kannil ethunnath — athukond rainbow-il RED mukalil. Baakki colours fan aayi miss aakum. Drag cheythal split move aakunnathu kanam. Fan kondu kanikkan vendi exaggerate cheythittund, angles true aanu.';
}

function frame(now){ if(!lastT) lastT=now; const t=(now-lastT)/1000; ctx.clearRect(0,0,W,H); if(state.mode==='refraction') drawRefraction(t); else if(state.mode==='prism') drawPrism(t); else drawRaindrop(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

function pointerPos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function applyPointer(p){
  if(state.mode==='refraction'){
    const {ox,oy}=refrGeom();
    const isWaterAir=state.dir==='water-air';
    const dx=Math.abs(p.x-ox), dy=Math.abs(p.y-oy);
    state.side = p.x < ox ? 1 : -1;
    let th=Math.atan2(dx, Math.max(dy,1));
    if(isWaterAir && Math.abs(th-THETA_C)<0.6*D2R) th=THETA_C;
    state.theta=clamp(th,2*D2R,85*D2R);
  } else if(state.mode==='prism'){
    const {A,B}=prismGeom();
    const E={x:A.x+state.entryS*(B.x-A.x), y:A.y+state.entryS*(B.y-A.y)};
    let sx=Math.min(p.x,E.x-60); sx=Math.max(20,sx);
    let sy=clamp(p.y,20,H-20);
    state.source={x:sx,y:sy};
  } else {
    const {cx1,cy1,cx2,cy2,R}=rainGeom();
    const useUpper = p.y < (cy1+cy2)/2;
    const cy = useUpper?cy1:cy2;
    state.rainH = clamp((cy-p.y)/R, 0.45, 0.92);
  }
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); dragging=true; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId); applyPointer(pointerPos(e)); if(!hasDragged){hasDragged=true; hintEl.classList.add('gone');} });
cv.addEventListener('pointermove',function(e){ if(!dragging) return; e.preventDefault(); applyPointer(pointerPos(e)); });
function endDrag(e){ if(!dragging) return; dragging=false; cv.classList.remove('dragging'); try{cv.releasePointerCapture(e.pointerId);}catch(_){} }
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag); cv.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });
const hintMap={ refraction:'Drag anywhere to swing the ray — snaps only within 1° of critical (48.6°)', prism:'Drag the white light source to change the angle — watch VIBGYOR split', raindrop:'Drag up/down to change sunlight height — red from upper drop, violet from lower drop' };
function updateDock(){
  if(state.mode==='refraction'){ swapBtn.style.display=''; swapBtn.textContent=state.dir==='water-air'?'⇅ Air → Water':'⇅ Water → Air'; } else { swapBtn.style.display='none'; }
  let hint=hintMap[state.mode]||'Drag to move the light';
  if(state.mode==='refraction'){ hint=state.dir==='water-air'?'Drag anywhere to swing the ray — near 48.6° the grazing ray stays visible, then fades gradually':'Drag anywhere to change the angle — light bends toward the normal in water'; }
  hintTxt.textContent=hint;
  document.querySelectorAll('button.mode').forEach(function(b){ b.classList.toggle('active',b.dataset.mode===state.mode); });
}
document.querySelectorAll('button.mode').forEach(function(btn){ btn.addEventListener('click',function(){ state.mode=btn.dataset.mode; if(state.mode==='prism') state.source=null; updateDock(); hintEl.classList.remove('gone'); hasDragged=false; }); });
swapBtn.addEventListener('click',function(){ state.dir=state.dir==='water-air'?'air-water':'water-air'; state.theta=30*D2R; state.side=1; updateDock(); });
document.getElementById('resetBtn').addEventListener('click',function(){ if(state.mode==='refraction'){ state.theta=30*D2R; state.side=1; state.dir='water-air'; } else if(state.mode==='prism'){ state.entryS=0.5; state.source=null; } else { state.rainH=0.86; } updateDock(); });
updateDock();
window.__lightLab=state;
})();
</script>
