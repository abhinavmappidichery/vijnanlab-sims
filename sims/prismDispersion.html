<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Light Lab — Prism</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#070f1c;color:#e6eefc;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Malayalam",sans-serif;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #hint{position:absolute;left:16px;top:16px;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:rgba(11,26,46,.82);border:1px solid rgba(125,211,252,.35);color:#bae6fd;font-size:15px;font-weight:700;pointer-events:none;transition:opacity .45s;backdrop-filter:blur(6px);max-width:calc(100% - 32px)}
  #hint .dot{width:10px;height:10px;border-radius:50%;background:#fde68a;box-shadow:0 0 12px #fde68a;animation:pulse 1.4s infinite;flex:0 0 auto}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.45}}
  #hint.gone{opacity:0}
  #dock{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#0e1e33,#0a1526);border-top:1px solid rgba(125,211,252,.20);box-shadow:0 -12px 30px rgba(0,0,0,.5)}
  .dock-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .stats{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .chip{display:inline-flex;align-items:baseline;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(125,211,252,.18);font-size:15px;white-space:nowrap}
  .chip .lbl{color:#93c5fd;font-weight:700}
  .chip .val{color:#fff;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
  .chip.status{font-weight:800;letter-spacing:.03em;font-size:13px;padding:10px 16px}
  .chip.status.refraction{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.45);color:#86efac}
  .chip.status.tir{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.55);color:#fda4af;animation:flash 1.1s infinite}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}
  #resetBtn{font:inherit;font-weight:800;font-size:15px;padding:11px 20px;border-radius:12px;border:1px solid rgba(148,197,255,.25);background:rgba(255,255,255,.05);color:#cbd5e1;cursor:pointer;white-space:nowrap}
  #resetBtn:hover{background:rgba(255,255,255,.1)}
  .tip{font-size:14px;color:#94a3b8;line-height:1.45}
  .tip b{color:#fde68a}
  @media(max-width:720px){.chip{font-size:13px;padding:8px 11px}.chip .val{font-size:15px}#resetBtn{font-size:13px;padding:9px 14px}.tip{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"><span class="dot"></span><span id="hintText">Drag the white light source</span></div>
  </div>
  <footer id="dock">
    <div class="dock-row">
      <div class="stats" id="stats"></div>
      <button id="resetBtn">↺ Reset</button>
    </div>
    <div class="dock-row"><div class="tip" id="tip"></div></div>
  </footer>
</div>
<script>
(function(){
'use strict';
const D2R = Math.PI / 180;
const R2D = 180 / Math.PI;
const N_AIR = 1.000;
const SPECTRUM = [
  { name:'Red',    color:'#ff4d4d', nGlass:1.510 },
  { name:'Orange', color:'#ff9f43', nGlass:1.513 },
  { name:'Yellow', color:'#ffdd59', nGlass:1.516 },
  { name:'Green',  color:'#4ade80', nGlass:1.518 },
  { name:'Blue',   color:'#3b82f6', nGlass:1.521 },
  { name:'Indigo', color:'#818cf8', nGlass:1.523 },
  { name:'Violet', color:'#a855f7', nGlass:1.526 },
];
const state = { entryS: 0.50, source: null };
let W=1,H=1,DPR=1,UI=1,dragging=false,hasDragged=false,lastT=0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
const statsEl=document.getElementById('stats'), tipEl=document.getElementById('tip'), hintEl=document.getElementById('hint'), hintTxt=document.getElementById('hintText');

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function resize(){
  const r=stage.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,Math.round(r.width));
  H=Math.max(1,Math.round(r.height));
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  UI=clamp(H/700,0.90,1.30);
  state.source=null;
}
new ResizeObserver(resize).observe(stage); resize();

function norm(x,y){ const m=Math.hypot(x,y)||1; return {x:x/m,y:y/m}; }
function dot(a,b){ return a.x*b.x+a.y*b.y; }
function refract(d,n,eta){ let N=n; if(dot(d,N)>0) N={x:-n.x,y:-n.y}; const cosI=-dot(d,N); const sin2=eta*eta*(1-cosI*cosI); if(sin2>1) return null; const cosT=Math.sqrt(1-sin2); const f=eta*cosI-cosT; return norm(eta*d.x+f*N.x, eta*d.y+f*N.y); }
function raySegment(p,d,a,b){ const ex=b.x-a.x, ey=b.y-a.y; const det=ex*d.y-d.x*ey; if(Math.abs(det)<1e-9) return null; const qx=a.x-p.x, qy=a.y-p.y; const t=(qy*ex-qx*ey)/det; const s=(d.x*qy-d.y*qx)/det; if(t<1e-6||s<0||s>1) return null; return t; }
function outwardNormal(a,b,third){ const ex=b.x-a.x, ey=b.y-a.y; const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; const vx=mx-third.x, vy=my-third.y; const nx1=ey, ny1=-ex; if(nx1*vx+ny1*vy>0) return norm(nx1,ny1); return norm(-ey,ex); }

function prismGeom(){
  const sw=Math.min(W,H*1.6), sx=(W-sw)/2;
  const baseCx=sx+sw*0.40, baseY=H*0.74;
  const halfBase=Math.min(sw*0.18, H*0.30);
  const B={x:baseCx-halfBase,y:baseY}, C={x:baseCx+halfBase,y:baseY}, A={x:baseCx,y:baseY-halfBase*Math.sqrt(3)};
  return {A,B,C};
}

function tracePrism(entry,d,nGlass){
  const {A,B,C}=prismGeom();
  const nAB=outwardNormal(A,B,C);
  const r1=refract(d,nAB,N_AIR/nGlass);
  if(!r1) return null;
  let best=null;
  const tAC=raySegment(entry,r1,A,C);
  if(tAC!==null) best={t:tAC,edge:'AC'};
  const tBC=raySegment(entry,r1,B,C);
  if(tBC!==null&&(best===null||tBC<best.t)) best={t:tBC,edge:'BC'};
  if(!best) return null;
  const exit={x:entry.x+r1.x*best.t, y:entry.y+r1.y*best.t};
  const nExit = best.edge==='AC' ? outwardNormal(A,C,B) : outwardNormal(B,C,A);
  const r2=refract(r1,nExit,nGlass/N_AIR);
  if(!r2) return null;
  return {entry,r1,exit,r2};
}

function beam(x1,y1,x2,y2,color,alpha,width){ if(alpha<0.02) return; ctx.save(); ctx.lineCap='round'; ctx.globalAlpha=alpha; ctx.shadowColor=color; ctx.shadowBlur=16; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=alpha*0.9; ctx.strokeStyle='rgba(255,255,255,.88)'; ctx.lineWidth=Math.max(1,width*0.35); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
function label(txt,x,y,size,color,align){ ctx.save(); ctx.fillStyle=color; ctx.font='800 '+(size*UI)+'px system-ui, sans-serif'; ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(txt,x,y); ctx.restore(); }
function puck(x,y,t){ const p=1+0.08*Math.sin(t*4); ctx.save(); ctx.shadowColor='#fde68a'; ctx.shadowBlur=26; ctx.fillStyle='rgba(253,230,138,.97)'; ctx.beginPath(); ctx.arc(x,y,14*p,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.strokeStyle='rgba(253,230,138,.40)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,22*p,0,Math.PI*2); ctx.stroke(); ctx.restore(); }

function drawPrism(t){
  // Background
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1930'); g.addColorStop(1,'#061020');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const {A,B,C}=prismGeom();

  // Prism body
  ctx.save();
  ctx.fillStyle='rgba(125,211,252,.07)';
  ctx.strokeStyle='rgba(125,211,252,.8)';
  ctx.lineWidth=2.5;
  ctx.shadowColor='#38bdf8'; ctx.shadowBlur=20;
  ctx.beginPath();
  ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  label('GLASS PRISM', (B.x+C.x)/2, B.y-18, 15, 'rgba(147,197,253,.95)', 'center');
  label('60° apex', (B.x+C.x)/2, B.y-2, 12, 'rgba(148,163,184,.8)', 'center');

  // Entry point on AB
  const E = { x: A.x + state.entryS*(B.x-A.x), y: A.y + state.entryS*(B.y-A.y) };

  // Init source
  if(!state.source){
    const off = Math.min(300, Math.max(140, W*0.22));
    state.source = { x: Math.max(20, E.x-off), y: E.y };
  }
  const src = state.source;
  const d = norm(E.x-src.x, E.y-src.y);

  // Normal at entry (dashed)
  const nAB = outwardNormal(A,B,C);
  ctx.save();
  ctx.setLineDash([4,6]);
  ctx.strokeStyle='rgba(148,197,255,.45)';
  ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(E.x - nAB.x*95, E.y - nAB.y*95);
  ctx.lineTo(E.x + nAB.x*95, E.y + nAB.y*95);
  ctx.stroke();
  ctx.restore();

  // θᵢ angle arc at entry
  const incAngle = Math.acos(Math.min(1, Math.abs(dot(d, nAB)))) * R2D;
  const nAng = Math.atan2(nAB.y, nAB.x);
  const revIncAng = Math.atan2(-d.y, -d.x);
  let arcDiff = revIncAng - nAng;
  while(arcDiff > Math.PI) arcDiff -= 2*Math.PI;
  while(arcDiff < -Math.PI) arcDiff += 2*Math.PI;
  const arcR = 38;
  ctx.save();
  ctx.strokeStyle='rgba(253,230,138,.9)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(E.x, E.y, arcR, nAng, nAng+arcDiff, arcDiff<0);
  ctx.stroke();
  ctx.restore();
  const arcMid = nAng + arcDiff/2;
  label('θᵢ='+incAngle.toFixed(1)+'°', E.x + Math.cos(arcMid)*(arcR+30), E.y + Math.sin(arcMid)*(arcR+30), 14, '#fde68a', 'center');

  // White incident beam
  beam(src.x, src.y, E.x, E.y, '#ffffff', 1, 6);
  label('White light', src.x+10, src.y-16, 14, 'rgba(255,255,255,.9)');

  // Trace all colors
  const rays = [];
  for(const c of SPECTRUM){
    const tr = tracePrism(E, d, c.nGlass);
    if(tr) rays.push({c, tr});
  }

  // Interior rays
  for(const {c,tr} of rays){
    ctx.save();
    ctx.strokeStyle=c.color; ctx.shadowColor=c.color; ctx.shadowBlur=10;
    ctx.lineWidth=2.2; ctx.globalAlpha=0.9;
    ctx.beginPath();
    ctx.moveTo(tr.entry.x, tr.entry.y);
    ctx.lineTo(tr.exit.x, tr.exit.y);
    ctx.stroke();
    ctx.restore();
  }

  // Exit rays (long, fan out)
  const bigL = Math.hypot(W,H) * 1.15;
  for(const {c,tr} of rays){
    ctx.save();
    ctx.strokeStyle=c.color; ctx.shadowColor=c.color; ctx.shadowBlur=12;
    ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.globalAlpha=0.95;
    ctx.beginPath();
    ctx.moveTo(tr.exit.x, tr.exit.y);
    ctx.lineTo(tr.exit.x + tr.r2.x*bigL, tr.exit.y + tr.r2.y*bigL);
    ctx.stroke();
    ctx.restore();
  }

  // Labels near exit — Red top / Violet bottom
  const red = rays.find(r => r.c.name === 'Red');
  const vio = rays.find(r => r.c.name === 'Violet');
  if(red && vio){
    const labelL = 150;
    label('Red (least)', red.tr.exit.x + red.tr.r2.x*labelL, red.tr.exit.y + red.tr.r2.y*labelL, 14, '#ff6b6b', 'center');
    label('Violet (most)', vio.tr.exit.x + vio.tr.r2.x*labelL, vio.tr.exit.y + vio.tr.r2.y*labelL, 14, '#c084fc', 'center');
  }

  // Source puck
  puck(src.x, src.y, t);

  // Stats
  let spread = '—';
  if(red && vio){
    const aR = Math.atan2(red.tr.r2.y, red.tr.r2.x) * R2D;
    const aV = Math.atan2(vio.tr.r2.y, vio.tr.r2.x) * R2D;
    spread = Math.abs(aV - aR).toFixed(1) + '°';
  }

  let chips = `<div class="chip"><span class="lbl">θᵢ</span><span class="val">${incAngle.toFixed(1)}°</span></div>`;
  chips += `<div class="chip"><span class="lbl">Spread</span><span class="val">${spread}</span></div>`;
  if(rays.length === 0){
    chips += `<div class="chip status tir">TIR inside prism — drag source</div>`;
    tipEl.innerHTML = '<b>Tip:</b> The incident angle is too steep — light reflects inside the prism (TIR). Drag the source to a gentler angle to see VIBGYOR split.';
  } else if(rays.length < SPECTRUM.length){
    chips += `<div class="chip status refraction">${rays.length} of 7 colours exit — VIBGYOR</div>`;
    tipEl.innerHTML = '<b>Tip:</b> Some colours have Total Internal Reflection inside the prism at this angle. Red always exits first. Drag source to see full VIBGYOR.';
  } else {
    chips += `<div class="chip status refraction">FULL VIBGYOR — Red top</div>`;
    tipEl.innerHTML = '<b>Tip:</b> ';
  }
  statsEl.innerHTML = chips;
}

function frame(now){ if(!lastT) lastT=now; const t=(now-lastT)/1000; ctx.clearRect(0,0,W,H); drawPrism(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

function pointerPos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function applyPointer(p){
  const {A,B}=prismGeom();
  const E={x:A.x+state.entryS*(B.x-A.x), y:A.y+state.entryS*(B.y-A.y)};
  let sx=Math.min(p.x, E.x-60); sx=Math.max(20, sx);
  let sy=clamp(p.y, 20, H-20);
  state.source = { x:sx, y:sy };
}
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); dragging=true; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId); applyPointer(pointerPos(e)); if(!hasDragged){hasDragged=true; hintEl.classList.add('gone');} });
cv.addEventListener('pointermove',function(e){ if(!dragging) return; e.preventDefault(); applyPointer(pointerPos(e)); });
function endDrag(e){ if(!dragging) return; dragging=false; cv.classList.remove('dragging'); try{cv.releasePointerCapture(e.pointerId);}catch(_){} }
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag); cv.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });

hintTxt.textContent = 'Drag the white light source to change the angle';

document.getElementById('resetBtn').addEventListener('click',function(){
  state.entryS = 0.50;
  state.source = null;
});
window.__lightLab=state;
})();
</script>
</body>
</html>
